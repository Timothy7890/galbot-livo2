# Galbot G1 上的 FAST-LIVO2 参数。以官方 avia.yaml 为底，改动处有注释。
# 外参在 g1_calib.yaml、相机模型在 camera_g1.yaml，二者由 scripts/gen_config.py 生成
common:
  img_topic: "/galbot/camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0      # 相机与雷达同用系统时钟，先按 0；慢速原地转一圈后再实测修正
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 8             # LIVOX_PC2：Galbot SDK 给的 PointCloud2，逐点时间在 offset_nsec
  scan_line: 4
  blind: 0.5                # 剔除雷达附近车身上的点

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: true    # 地图 z 轴对齐重力，便于后续导出给 3DGS

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "galbot"
  pose_output_en: false

pcd_save:
  pcd_save_en: true         # 结束时保存彩色地图，record.sh 移到录制目录
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.05    # map.pcd 降采样体素，作为 3DGS 初始点云
  interval: -1

image_save:
  img_save_en: false
  interval: 1
